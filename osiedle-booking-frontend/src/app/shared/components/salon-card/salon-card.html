<a class="salon-card" [routerLink]="['/salons', salon().businessId]">
  <div class="salon-card__image-wrapper">
    <img
      class="salon-card__image"
      [src]="salon().photoUrl"
      [alt]="salon().name"
      loading="lazy"
    />

    <div class="salon-card__rating">
      <svg class="salon-card__star" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
      </svg>
      <span>{{ salon().raiting | number: '1.1-1' }}</span>
    </div>
  </div>

  <div class="salon-card__body">
    <div class="salon-card__location">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
        <circle cx="12" cy="10" r="3" />
      </svg>
      <span>{{ salon().location.city }}, {{ salon().location.street }}</span>
    </div>

    <h3 class="salon-card__title">{{ salon().name }}</h3>

    @if (salon().description) {
      <p class="salon-card__description">{{ salon().description }}</p>
    }
  </div>
</a>
