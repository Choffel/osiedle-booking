<section class="stats-grid">
  <article class="stat-card">
    <div>
      <div class="stat-card__value">{{ completedCount() }}</div>
      <div class="stat-card__label">Zrealizowanych wizyt</div>
    </div>
    <div class="stat-card__icon stat-card__icon--slate">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
        <path d="M12 7v5l4 2" />
      </svg>
    </div>
  </article>

  <article class="stat-card">
    <div>
      <div class="stat-card__value stat-card__value--accent">{{ upcomingCount() }}</div>
      <div class="stat-card__label">Nadchodząca rezerwacja</div>
    </div>
    <div class="stat-card__icon stat-card__icon--teal">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
        <path d="m9 16 2 2 4-4" />
      </svg>
    </div>
  </article>

  <article class="stat-card">
    <div>
      <div class="stat-card__value">{{ favoritesCount() }}</div>
      <div class="stat-card__label">Ulubione salony</div>
    </div>
    <div class="stat-card__icon stat-card__icon--amber">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
      </svg>
    </div>
  </article>
</section>
