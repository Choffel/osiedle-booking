<section class="sidebar-card">
  <div class="sidebar-card__header">
    <div class="sidebar-card__title-row">
      <span class="sidebar-card__heart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>
      </span>
      <h3 class="sidebar-card__title">Ulubione barbershopy</h3>
    </div>

    <a routerLink="/" class="sidebar-card__link">Zobacz ({{ salons().length }})</a>
  </div>

  <div class="favorite-list">
    @for (salon of salons(); track salon.businessId) {
      <a [routerLink]="['/salon', salon.businessId]" class="favorite-item">
        <div class="favorite-item__info">
          <div class="favorite-item__name">{{ salon.name }}</div>
          <div class="favorite-item__meta">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
            <span>{{ salon.locationLabel }} • {{ salon.distanceLabel }}</span>
          </div>
        </div>

        <div class="favorite-item__rating">
          <span>★ {{ salon.rating }}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </div>
      </a>
    }
  </div>
</section>
