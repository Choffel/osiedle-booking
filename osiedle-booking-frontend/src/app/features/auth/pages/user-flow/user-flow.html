<div class="auth-select-card">
  <h1 class="auth-select-card__title">Wybierz rodzaj konta</h1>
  <p class="auth-select-card__subtitle">
    Wybierz konto, aby kontynuować logowanie lub rejestrację
  </p>

  <div class="auth-select-card__options">
    <a routerLink="/login" class="account-option">
      <div class="account-option__content">
        <span class="account-option__title">Barberio dla klientów</span>
        <span class="account-option__desc">Rezerwuj usługi w salonach i spa w Twojej okolicy</span>
      </div>
      <svg class="account-option__arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14" />
        <path d="M12 5l7 7-7 7" />
      </svg>
    </a>

    <a routerLink="/auth/partner" class="account-option">
      <div class="account-option__content">
        <span class="account-option__title">Barberio dla profesjonalistów</span>
        <span class="account-option__desc">Zarządzaj swoim biznesem i zdobywaj nowych klientów</span>
      </div>
      <svg class="account-option__arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14" />
        <path d="M12 5l7 7-7 7" />
      </svg>
    </a>
  </div>
</div>
