<header class="salon-header">
  <nav class="salon-header__breadcrumbs">
    <a routerLink="/">Główna</a>
    <span>›</span>
    <span>{{ business().location.city }}</span>
    <span>›</span>
    <span class="current">{{ business().name }}</span>
  </nav>

  <div class="salon-header__top">
    <div>
      <div class="salon-header__title-row">
        <h1 class="salon-header__title">{{ business().name }}</h1>
        <span class="salon-header__category">{{ business().category }}</span>
      </div>

      <p class="salon-header__address">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        <span>{{ business().location.street }}, {{ business().location.city }}</span>
      </p>
    </div>
  </div>

  <div class="salon-header__hero">
    <img [src]="coverPhoto()" [alt]="business().name" />
  </div>
</header>
