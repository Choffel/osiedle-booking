<div class="booking-card">
  <div class="booking-card__badge">{{ business().category }}</div>
  <h2 class="booking-card__title">{{ business().name }}</h2>

  @if (business().description) {
    <p class="booking-card__desc">{{ business().description }}</p>
  }

  <div class="booking-card__divider"></div>

  <div class="booking-card__address">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
      <circle cx="12" cy="10" r="3" />
    </svg>
    <span>{{ business().location.street }}, {{ business().location.city }}</span>
  </div>

  <div class="booking-card__divider"></div>

  <p class="booking-card__hint">
    Wybierz interesującą Cię usługę z listy obok i kliknij <strong>Zarezerwuj</strong>, aby wybrać specjalistę oraz termin wizyty.
  </p>
</div>
