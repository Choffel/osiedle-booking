<div class="services-catalog">
  <!-- 1. Шапка каталога -->
  <div class="services-catalog__header">
    <div>
      <h2 class="services-catalog__title">Katalog usług</h2>
      <p class="services-catalog__subtitle">Wybierz zabieg i dopasuj dogodny termin</p>
    </div>
    <span class="services-catalog__badge">
      <span class="icon">🕒</span> Błyskawiczne potwierdzenie online
    </span>
  </div>

  <!-- 2. Секция категории (например, Strzyżenie męskie) -->
  <div class="services-category">
    <h3 class="services-category__title">
      <span class="dot"></span> Strzyżenie męskie
    </h3>

    <div class="services-list">
      @for (service of salon().services; track service.name) {
        <div class="service-card">
          <!-- Левая часть: инфо об услуге -->
          <div class="service-card__info">
            <div class="service-card__title-row">
              <h4 class="service-card__name">{{ service.name }}</h4>
            </div>
            <p class="service-card__description">{{ service.description }}</p>
            <div class="service-card__duration">
              <span class="icon">🕒</span> {{ service.duration }}
            </div>
          </div>

          <!-- Правая часть: цена и кнопка -->
          <div class="service-card__action">
            <span class="service-card__price">{{ service.price }} PLN</span>
            <button 
              type="button" 
              class="btn-book"
              (click)="selectService.emit(salon())">
              Zarezerwuj
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</div>
