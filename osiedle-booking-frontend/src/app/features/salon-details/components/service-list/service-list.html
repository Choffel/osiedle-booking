<div class="service-list">
  @for (service of services(); track service.bookableServiceId) {
    <div class="service-item">
      <div class="service-item__info">
        <div class="service-item__header">
          <h3 class="service-item__name">{{ service.serviceName }}</h3>
          <span class="service-item__tag">{{ service.category }}</span>
        </div>

        <div class="service-item__meta">
          <span class="service-item__duration">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            {{ formatDuration(service.duration) }}
          </span>
        </div>
      </div>

      <div class="service-item__actions">
        <span class="service-item__price">{{ service.price }} PLN</span>
        <button
          type="button"
          class="service-item__btn"
          (click)="selectService.emit(service)"
        >
          Zarezerwuj
        </button>
      </div>
    </div>
  } @empty {
    <p class="service-list__empty">Brak dostępnych usług w tym salonie.</p>
  }
</div>
